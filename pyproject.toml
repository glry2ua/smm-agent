[project]
name = "smm-agent"
version = "0.1.0"
description = "A weekly Cloudflare Python Worker for generating and scheduling social posts through Buffer."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "openai-agents>=0.3,<1",
    "pydantic==2.10.6",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "ty>=0.0.77",
    "workers-py>=1.7",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF"]
# The en dash appears in user-facing copy (help text, validation messages).
allowed-confusables = ["–"]

[tool.ruff.format]

[tool.ty.environment]
extra-paths = ["src"]

# `js` is provided by the Workers runtime at deploy time and has no stubs on disk.
[[tool.ty.overrides]]
include = ["src/images/image_pipeline.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.uv]
package = false
